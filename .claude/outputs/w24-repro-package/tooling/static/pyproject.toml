[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nclu"
version = "0.1.0"
description = "naive-CLU: deletable compositional generation on a frozen encoder (code for the paper's tables and figures)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jax==0.9.0",
    "jaxlib==0.9.0",
    "numpy==2.4.1",
    "equinox==0.13.4",
    "optax==0.2.6",
    "scipy==1.17.0",
    "h5py==3.16.0",
    "matplotlib==3.10.8",
    "scikit-learn==1.8.0",
    "chex==0.1.91",
    "jaxtyping==0.3.6",
    "wadler-lindig==0.1.7",
    "ml-dtypes==0.5.4",
    "opt-einsum==3.4.0",
    "absl-py==2.4.0",
    "toolz==1.1.0",
    "typing-extensions==4.15.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.61.1",
    "kiwisolver==1.4.9",
    "packaging==26.0",
    "pillow==12.1.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
include = ["nclu*"]

[tool.setuptools.package-data]
nclu = ["*.json", "specs/*.json"]
