[project]
name = "chlu"
version = "0.2.4"
description = "Causal Hamiltonian Learning Unit"
authors = [{ name = "Pratik Jawahar" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"

dependencies = [
    "numpy",
    "scipy",
    "jax",
    "jaxlib",
    "equinox",
    "optax",
    "diffrax",
    "matplotlib",
    "tqdm",
    "rich",
    "art",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
# Industrial-eval harness loaders (chlu/data/industrial): install via
#   uv sync --extra eval
# NOTE: metrics do NOT need this extra — TSB-AD's evaluation code is vendored
# (chlu/eval/_tsb_vendor) because the TSB-AD distribution pins numpy<2.0,
# which would force a project-wide numpy downgrade through the uv lock.
eval = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyreadr>=0.5.0",
]
# CAFE benchmark integration (chlu/eval/cafe_model.py, scripts/cafe/): install via
#   uv sync --extra cafe
# lifelines backs cafe-bench's default CoxPH event probe.
# ⚠ lifelines pins pandas<3, and uv resolves ONE pandas for the whole lock, so
# declaring this extra pinned the locked pandas 3.0.3 -> 2.3.3 PROJECT-WIDE:
# `uv sync --extra eval` now also gets 2.3.3. That is compatible (eval only needs
# >=2.0) and the full suite is green at 354, but it is a real lockfile-wide change,
# not an isolated one. Revisit if anything starts needing pandas 3.x.
# cafe_bench itself is NOT declared here — it is a separate checkout kept outside
# this repo (see scripts/cafe/run_clu_cafe.py); chlu never imports it at module scope.
cafe = [
    "lifelines>=0.30",
    "pandas>=2.0,<3",
]
# GPU (NVIDIA) support via self-contained pip CUDA wheels — Linux only.
# On macOS this extra is a no-op (marker), so `uv sync --extra cuda` is safe everywhere.
# jax[cuda12] pulls jax-cuda12-plugin[with-cuda] (bundled CUDA/cuDNN libs);
# the target node only needs an NVIDIA driver >= 525.60.13 (CSF3 A100 nodes: 580.126.09).
cuda = ["jax[cuda12]; sys_platform == 'linux'"]

[project.scripts]
chlu = "chlu.chlu:main"

[dependency-groups]
dev = [
    "black>=25.1.0,<26",
    "pylint>=3.3.4,<4",
    "wrapt>=1.17.2,<2",
    "sphinx>=8.1.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.13",
]

test = ["pytest>=8.0.0,<9", "pytest-cov>=5.0.0,<6", "pytest-xdist>=3.5.0,<4"]

[tool.ruff]
# Pinned vendored third-party code (TSB-AD evaluation) is not linted/formatted.
extend-exclude = ["chlu/eval/_tsb_vendor"]

[tool.ruff.lint]
extend-select = ["B"]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=chlu --cov-report=xml --cov-report=term"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
packages = ["chlu", "chlu.core", "chlu.training", "chlu.data", "chlu.experiments", "chlu.utils", "chlu.cli"]
